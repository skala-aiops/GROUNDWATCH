name: groundwatch
services:
  serving-app:
    build:
      context: .
      dockerfile: serving_app/Dockerfile
    ports:
      - "${GROUNDWATCH_PORT:-8100}:8099"
    environment:
      GROUNDWATCH_STATE_DIR: /app/runtime/groundwatch
      GROUNDWATCH_CURRENT_EXTENSION: ${GROUNDWATCH_CURRENT_EXTENSION:-true}
      GROUNDWATCH_TRAIN_EPOCHS: ${GROUNDWATCH_TRAIN_EPOCHS:-100}
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      SEOUL_OPEN_DATA_KEY: ${SEOUL_OPEN_DATA_KEY:-}
      GIMS_API_KEY: ${GIMS_API_KEY:-}
      GIMS_STATION_API_KEY: ${GIMS_STATION_API_KEY:-}
      GROUNDWATCH_NATIONAL_OBSERVATION_COLLECTION_ENABLED: ${GROUNDWATCH_NATIONAL_OBSERVATION_COLLECTION_ENABLED:-true}
      GROUNDWATCH_EXPERIMENTAL_MONITORING_ENABLED: ${GROUNDWATCH_EXPERIMENTAL_MONITORING_ENABLED:-true}
      GROUNDWATCH_SEASONAL_EVALUATION_ENABLED: ${GROUNDWATCH_SEASONAL_EVALUATION_ENABLED:-true}
      GROUNDWATCH_SYNTHETIC_SEASONAL_EVALUATION_ENABLED: ${GROUNDWATCH_SYNTHETIC_SEASONAL_EVALUATION_ENABLED:-true}
      GROUNDWATCH_NATIONAL_SIMULATION_ENABLED: ${GROUNDWATCH_NATIONAL_SIMULATION_ENABLED:-true}
      GROUNDWATCH_SIMULATION_TRAIN_EPOCHS: ${GROUNDWATCH_SIMULATION_TRAIN_EPOCHS:-10}
      GROUNDWATCH_EXPERIMENTAL_MODELS_ENABLED: ${GROUNDWATCH_EXPERIMENTAL_MODELS_ENABLED:-true}
      GROUNDWATCH_EXPERIMENTAL_TRAIN_EPOCHS: ${GROUNDWATCH_EXPERIMENTAL_TRAIN_EPOCHS:-30}
      GROUNDWATCH_WEATHER_COLLECTION_ENABLED: ${GROUNDWATCH_WEATHER_COLLECTION_ENABLED:-true}
      KMA_APIHUB_KEY: ${KMA_APIHUB_KEY:-}
      GROUNDWATCH_NATIONAL_SCHEDULER_ENABLED: ${GROUNDWATCH_NATIONAL_SCHEDULER_ENABLED:-true}
      KMA_ASOS_SERVICE_KEY: ${KMA_ASOS_SERVICE_KEY:-}
      GROUNDWATCH_COLLECTION_ENABLED: ${GROUNDWATCH_COLLECTION_ENABLED:-true}
    volumes:
      - tracking:/app/runtime
      - artifacts:/app/mlruns
      - models:/app/serving_app/models
      - uploads:/app/data/uploads
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://localhost:8099/health/live',timeout=5)); assert r['status']=='alive'"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 4
volumes:
  tracking:
  artifacts:
  models:
  uploads:
  logs:
